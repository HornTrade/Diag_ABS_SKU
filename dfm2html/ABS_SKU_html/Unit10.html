<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<title>Form10</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:#a0a0a0;font-family:"MS Sans Serif",Tahoma,sans-serif;font-size:11px;color:#000;}
  .app{display:flex;flex-direction:column;width:100vw;height:100vh;background:#ece9d8;}
  .app-header{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:linear-gradient(#0a246a,#3a6ea5);color:#fff;font-size:12px;flex-shrink:0;}
  .app-title{font-weight:bold;}
  .app-lamps{display:flex;gap:10px;align-items:flex-end;}
  .lamp-pair{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .lamp{width:18px;height:18px;border-radius:50%;border:1px solid #333;background:#555;cursor:pointer;}
  .lamp.on.off{background:#8b0000;}
  .lamp.on.warn{background:#ffb000;}
  .lamp.on.ok{background:#0a0;}
  .lamp-pair .lbl{font-size:10px;color:#fff;line-height:1;}
  .menu-bar{display:flex;background:#ece9d8;padding:2px 0;border-bottom:1px solid #aaa;flex-shrink:0;}
  .menu-bar>span{padding:2px 10px;cursor:pointer;font-size:11px;}
  .menu-bar>span:hover{background:#316ac5;color:#fff;}
  .toolbar{display:flex;flex-wrap:wrap;gap:2px;background:#d4d0c8;padding:3px 6px;border-bottom:1px solid #aaa;flex-shrink:0;}
  .toolbar>button{padding:3px 10px;border:1px solid transparent;background:none;cursor:pointer;font-size:11px;}
  .toolbar>button:hover{border-color:#888;background:#ece9d8;}
  .toolbar>button:disabled{color:#999;cursor:default;}
  .app-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .pagecontrol{display:flex;flex-direction:column;width:100%;height:100%;min-height:120px;flex:1 1 auto;}
  .tabs-bar{display:flex;flex-wrap:wrap;background:#ece9d8;padding:2px 4px 0;border-bottom:1px solid #888;flex-shrink:0;}
  .tabs-bar>a{padding:3px 12px;background:#d4d0c8;border:1px solid #888;border-bottom:none;margin-right:2px;color:#000;text-decoration:none;font-size:11px;}
  .tabs-bar>a.active{background:#ece9d8;margin-bottom:-1px;padding-bottom:4px;}
  .tabs-bar>a:hover{background:#e4e0d8;}
  .tab-panes{flex:1 1 auto;overflow:auto;background:#ece9d8;padding:6px;}
  .tab-pane{display:none;}
  .tab-pane.active{display:flex;flex-direction:column;gap:8px;}
  .groupbox{border:1px solid #888;border-radius:3px;padding:8px 10px;background:#ece9d8;position:relative;}
  .groupbox>.gb-title{position:absolute;top:-7px;left:8px;background:#ece9d8;padding:0 4px;font-size:11px;line-height:1;pointer-events:none;}
  .groupbox-inner{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-top:4px;}
  .groupbox-inner>.groupbox{flex:1 1 100%;min-width:200px;}
  .groupbox-inner>.pagecontrol{flex:1 1 100%;min-height:200px;}
  .field{display:inline-flex;align-items:center;gap:6px;}
  .field>label{white-space:pre;font-size:11px;color:#000;line-height:1.2;}
  .field>input,.field>select{font-size:11px;padding:1px 4px;height:22px;border:1px solid #7f9db9;background:#fff;font-family:inherit;}
  input.form-control-sm,select.form-select-sm,textarea.memo{font-size:11px;font-family:"MS Sans Serif",Tahoma,sans-serif;}
  textarea.memo{width:100%;min-height:80px;max-height:300px;resize:vertical;font-family:Consolas,"Courier New",monospace;font-size:12px;padding:3px;border:1px solid #7f9db9;background:#fff;}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:11px;white-space:pre;cursor:pointer;line-height:1.2;}
  .chk>input[type=checkbox],.chk>input[type=radio]{width:13px;height:13px;margin:0;cursor:pointer;flex-shrink:0;}
  .chk-grid{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;}
  .btn-secondary,.btn-primary,.btn-danger{padding:3px 12px;font-size:11px;font-family:inherit;border:1px solid #888;border-radius:3px;cursor:pointer;background:#e4e0d8;min-width:60px;}
  .btn-primary{background:#d6e4f7;border-color:#316ac5;}
  .btn-danger{background:#f7d6d6;border-color:#c00000;}
  .btn-secondary:hover{background:#d4d0c8;}
  .btn-secondary:disabled,.btn-primary:disabled{color:#999;cursor:default;}
  .kv-table{border-collapse:collapse;width:100%;font-size:11px;margin-top:4px;}
  .kv-table td{padding:2px 12px 2px 0;vertical-align:top;}
  .kv-table td.k{white-space:pre;color:#000;}
  .kv-table td.v{white-space:pre;color:#333;}
  .grid{border-collapse:collapse;font-size:11px;margin-top:4px;}
  .grid td{border:1px solid #888;padding:1px 4px;min-width:22px;height:17px;}
  .radiogroup{border:1px solid #888;border-radius:3px;padding:8px 10px;position:relative;margin:2px 0;}
  .radiogroup>.gb-title{position:absolute;top:-7px;left:8px;background:#ece9d8;padding:0 4px;font-size:11px;line-height:1;}
  .statusbar{display:flex;background:#ece9d8;border-top:1px solid #888;padding:3px 10px;font-size:11px;gap:10px;flex-shrink:0;}
  .statusbar>span{padding:0 8px;border-right:1px solid #ccc;}
  .statusbar>span:last-child{border-right:none;}
  .dialog-wrapper{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);padding:20px;overflow:auto;}
  .dialog{background:#ece9d8;border:1px solid #555;border-radius:3px;padding:8px 12px 12px;max-width:min(95vw,800px);max-height:95vh;overflow:auto;display:flex;flex-direction:column;gap:8px;}
  .dialog-title{background:linear-gradient(#0a246a,#3a6ea5);color:#fff;padding:3px 8px;margin:-8px -12px 6px;font-weight:bold;font-size:12px;}
  .dfm-log{background:#111;color:#0f0;font-family:Consolas,monospace;font-size:12px;padding:4px;height:100px;overflow-y:auto;white-space:pre-wrap;border:1px solid #333;margin-top:6px;}
  .dfm-paintbox{border:1px solid #888;background:#fff;min-height:80px;}
  .dfm-chart{border:1px dashed #999;background:#fafafa;padding:14px;color:#888;text-align:center;font-style:italic;}
  .dfm-img{display:inline-block;border-radius:50%;border:1px solid #333;vertical-align:middle;}
  .progress{display:flex;height:14px;background:#ddd;border:1px solid #888;width:180px;overflow:hidden;}
  .progress>div{background:#0a64c8;height:100%;color:#fff;font-size:10px;text-align:center;line-height:12px;width:0;}
  input[type=range]{vertical-align:middle;}
</style>
</head><body>
<div class="dialog-wrapper"><div class="dialog">
<div class="dialog-title">Form10</div>
<span class="lbl">Host</span>
<span class="lbl">Port</span>
<span class="lbl">Mask</span>
<input id="Edit1" class="form-control-sm" type="text" value="192.168.0.10" style="width:121px;" aria-label="Edit1">
<input id="Edit2" class="form-control-sm" type="text" value="35000" style="width:121px;" aria-label="Edit2">
<input id="Edit3" class="form-control-sm" type="text" value="255.255.255.0" style="width:121px;" aria-label="Edit3">
<button type="button" class="btn-primary" onclick="ButtonXBR1_Click()">Connect</button>
<button type="button" class="btn-primary" onclick="ButtonXBR2_Click()">Disconnect</button>
<input id="Edit4" class="form-control-sm" type="text" value="" style="width:121px;" aria-label="Edit4">
<button type="button" class="btn-primary" onclick="ButtonXBR3_Click()">Send</button>
<input id="Edit5" class="form-control-sm" type="text" value="ATi" style="width:121px;" aria-label="Edit5">
<textarea id="mmo1" class="memo" aria-label="mmo1">Memo3</textarea>
<input id="Edit6" class="form-control-sm" type="text" value=" " style="width:49px;" aria-label="Edit6">
<select class="form-select form-select-sm" style="min-height:120px;">
  <option>AT ZAT IAT SP AAT DM1AT MP FE BFAT SP 9AT ALMR BMT BAT CP 18AT SH EA B FFAT FC  SH 18 EA B FFAT FC  SD 0 FE ECAT FC SM 1</option>
  <option>AT ZAT IAT SP AAT DM1AT MP FE BFAT SP 9AT ALMR BMT BAT CP 18AT SH EA B FFAT FC  SH 18 EA B FFAT FC  SD 0 FE ECAT FC SM 1</option>
</select>
</div></div>
<script>
  function dfmLog(m){const e=document.querySelector(".dfm-log");if(!e){console.log(m);return;}const t=new Date().toLocaleTimeString();e.innerHTML+="["+t+"] "+m+"\n";e.scrollTop=e.scrollHeight;}
  function dfmToggleLamp(el){el.classList.toggle("on");}

      document.addEventListener('click', function(e){
        var a = e.target.closest('.tabs-bar > a');
        if (!a) return;
        e.preventDefault();
        var group = a.closest('.pagecontrol');
        if (!group) return;
        var id = a.getAttribute('href').substring(1);
        group.querySelectorAll(':scope > .tabs-bar > a')
             .forEach(function(x){x.classList.remove('active');});
        group.querySelectorAll(':scope > .tab-panes > .tab-pane')
             .forEach(function(p){p.classList.remove('active');});
        a.classList.add('active');
        var pane = document.getElementById(id);
        if (pane) pane.classList.add('active');
      });
        
  function ButtonXBR1_Click(){ dfmLog("Клик: Connect"); }
  function ButtonXBR2_Click(){ dfmLog("Клик: Disconnect"); }
  function ButtonXBR3_Click(){ dfmLog("Клик: Send"); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
